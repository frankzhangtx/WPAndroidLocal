<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成长足迹模版 - A3</title>
  <style>
    @page {
      size: A3 portrait;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d9cfbf;
      font-family: "Arial", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #2f2631;
    }

    body {
      padding: 18px;
    }

    .sheet {
      position: relative;
      width: 297mm;
      height: 420mm;
      margin: 0 auto;
      overflow: hidden;
      background:
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 9px),
        #73529d;
      border: 1px solid rgba(0, 0, 0, 0.18);
      box-shadow: 0 14px 38px rgba(35, 22, 48, 0.28);
    }

    .sheet::before {
      content: "";
      position: absolute;
      inset: 7mm;
      border: 2px dashed rgba(255, 255, 255, 0.32);
      pointer-events: none;
    }

    .headline {
      position: absolute;
      left: 21mm;
      top: 12mm;
      right: 17mm;
      display: flex;
      align-items: flex-end;
      gap: 5mm;
      z-index: 4;
    }

    h1 {
      margin: 0;
      flex: 1;
      font-size: 31mm;
      line-height: 0.9;
      letter-spacing: 0;
      font-weight: 900;
      text-align: center;
      text-shadow:
        2px 2px 0 #24192d,
        -2px 2px 0 #24192d,
        2px -2px 0 #24192d,
        -2px -2px 0 #24192d,
        5px 6px 0 rgba(36, 25, 45, 0.36);
      -webkit-text-stroke: 2px #fff8e9;
    }

    h1 span {
      display: inline-block;
      padding: 0 0.7mm;
      transform-origin: 50% 80%;
    }

    h1 span:nth-child(1) {
      color: #ff5858;
      transform: rotate(-6deg);
    }

    h1 span:nth-child(2) {
      color: #ffd54f;
      transform: rotate(4deg) translateY(1mm);
    }

    h1 span:nth-child(3) {
      color: #38b7df;
      transform: rotate(-4deg);
    }

    h1 span:nth-child(4) {
      color: #7bd381;
      transform: rotate(6deg) translateY(1mm);
    }

    .subtitle {
      position: absolute;
      left: 91mm;
      top: 49mm;
      padding: 2mm 6mm;
      background: #fff0a8;
      border: 2px solid #24192d;
      color: #4a315a;
      font-size: 6.5mm;
      font-weight: 800;
      transform: rotate(-1deg);
      box-shadow: 2px 3px 0 rgba(36, 25, 45, 0.42);
      z-index: 5;
    }

    .profile-card {
      width: 55mm;
      padding: 4mm;
      background: #fff8e9;
      border: 2px solid #24192d;
      box-shadow: 3px 4px 0 rgba(36, 25, 45, 0.28);
      transform: rotate(2deg);
      font-size: 4mm;
      line-height: 1.6;
      font-weight: 700;
    }

    .profile-card div {
      border-bottom: 1px dashed rgba(47, 38, 49, 0.48);
      min-height: 6.4mm;
    }

    .profile-card span {
      color: #7a527f;
      font-weight: 600;
    }

    .film {
      position: absolute;
      left: 122.5mm;
      top: 70mm;
      width: 52mm;
      height: 316mm;
      padding: 6mm 7.5mm;
      background: #1f1b22;
      border: 2px solid #fff8e9;
      border-radius: 6px;
      box-shadow: 4px 5px 0 rgba(36, 25, 45, 0.45);
      z-index: 3;
    }

    .film::before,
    .film::after {
      content: "";
      position: absolute;
      top: 4mm;
      bottom: 4mm;
      width: 4mm;
      background:
        repeating-linear-gradient(
          0deg,
          #fff8e9 0 2.5mm,
          transparent 2.5mm 5.2mm
        );
      border-radius: 3px;
    }

    .film::before {
      left: 1.6mm;
    }

    .film::after {
      right: 1.6mm;
    }

    .film-title {
      position: absolute;
      left: 105mm;
      top: 60mm;
      width: 86mm;
      height: 31mm;
      z-index: 6;
      pointer-events: none;
    }

    .film-inner {
      display: grid;
      grid-template-rows: repeat(7, 1fr);
      gap: 3.2mm;
      height: 100%;
    }

    .film-frame {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      padding: 2mm 2.5mm;
      border: 1.5px solid #fff8e9;
      color: #fff8e9;
      text-align: center;
      border-radius: 3px;
      font-weight: 800;
    }

    .film-frame strong {
      display: block;
      margin-bottom: 1mm;
      font-size: 7.2mm;
      line-height: 1;
    }

    .film-frame span {
      display: block;
      font-family: "HanziPen SC", "Kaiti SC", "STKaiti", "Comic Sans MS", "Marker Felt", "Chalkboard SE", cursive;
      font-size: 3.4mm;
      line-height: 1.24;
      font-weight: 700;
    }

    .film-frame:nth-child(n+2) strong {
      margin-bottom: 3mm;
      transform: translateY(-3mm);
    }

    .film-frame:nth-child(n+2) span {
      transform: translateY(-3mm);
    }

    .film-frame:nth-child(1) { background: #3f80b8; }
    .film-frame:nth-child(2) { background: #bd6f83; }
    .film-frame:nth-child(3) { background: #e08947; }
    .film-frame:nth-child(4) { background: #6aa663; }
    .film-frame:nth-child(5) { background: #5f86b6; }
    .film-frame:nth-child(6) { background: #8967aa; }
    .film-frame:nth-child(7) { background: #c65774; }

    .cluster {
      position: absolute;
      padding: 5mm;
      border-radius: 6px;
      border: 2px solid rgba(255, 248, 233, 0.78);
      box-shadow: 4px 5px 0 rgba(36, 25, 45, 0.25);
      z-index: 2;
    }

    .cluster::after {
      content: "";
      position: absolute;
      inset: 3mm;
      border: 1px dashed rgba(255, 248, 233, 0.52);
      border-radius: 4px;
      pointer-events: none;
    }

    .cluster h2 {
      position: absolute;
      left: 5mm;
      top: -8mm;
      margin: 0;
      padding: 1.4mm 3mm;
      background: #fff8e9;
      border: 2px solid #24192d;
      border-radius: 4px;
      font-size: 5.4mm;
      line-height: 1;
      color: #33243b;
      box-shadow: 2px 2px 0 rgba(36, 25, 45, 0.28);
      z-index: 3;
    }

    .cluster small {
      display: block;
      margin-top: 1mm;
      font-size: 3.2mm;
      line-height: 1.35;
      font-weight: 800;
      color: #281d2c;
    }

    .photos {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 3mm;
    }

    .two-cols {
      grid-template-columns: 1fr 1fr;
    }

    .photo {
      position: relative;
      min-height: 38mm;
      background: #fff8e9;
      border: 2px solid #fff8e9;
      box-shadow: 2px 3px 0 rgba(36, 25, 45, 0.26);
      overflow: hidden;
    }

    .photo.tall {
      min-height: 64mm;
    }

    .photo.wide {
      min-height: 45mm;
    }

    .photo svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: inherit;
      background: #e9eef5;
    }

    .memo {
      position: absolute;
      z-index: 5;
      padding: 2mm 3mm;
      border-radius: 4px;
      border: 1.5px solid rgba(36, 25, 45, 0.9);
      color: #fff8e9;
      font-size: 3.6mm;
      line-height: 1.25;
      font-weight: 800;
      text-align: center;
      box-shadow: 2px 2px 0 rgba(36, 25, 45, 0.24);
    }

    .age-0 {
      left: 17mm;
      top: 76mm;
      width: 92mm;
      height: 71mm;
      background: #39a8c5;
      transform: rotate(2deg);
    }

    .age-1 {
      right: 18mm;
      top: 82mm;
      width: 82mm;
      height: 68mm;
      background: #c75272;
      transform: rotate(-3deg);
    }

    .age-2 {
      left: 21mm;
      top: 166mm;
      width: 86mm;
      height: 97mm;
      background: #ffe3a8;
      transform: rotate(-1deg);
    }

    .age-3 {
      right: 19mm;
      top: 158mm;
      width: 88mm;
      height: 87mm;
      background: #93c98b;
      transform: rotate(2deg);
    }

    .age-4 {
      left: 14mm;
      top: 279mm;
      width: 98mm;
      height: 102mm;
      background: #f28b1f;
      transform: rotate(1deg);
    }

    .age-5 {
      right: 17mm;
      top: 252mm;
      width: 89mm;
      height: 87mm;
      background: #ffd1c9;
      transform: rotate(-1.5deg);
    }

    .age-6 {
      right: 19mm;
      bottom: 7mm;
      width: 94mm;
      height: 68mm;
      background: #fff3a8;
      transform: rotate(1.2deg);
    }

    .age-6 .photos {
      grid-template-columns: 1.05fr 0.95fr;
    }

    .sticker {
      position: absolute;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2mm 3mm;
      min-width: 21mm;
      min-height: 11mm;
      border: 2px solid #24192d;
      border-radius: 4px;
      background: #ffdf4d;
      color: #33243b;
      font-size: 4mm;
      line-height: 1.15;
      text-align: center;
      font-weight: 900;
      box-shadow: 2px 2px 0 rgba(36, 25, 45, 0.32);
    }

    .heart {
      border-radius: 45% 45% 55% 55%;
      background: #ef4a47;
      color: #fff8e9;
      transform: rotate(-8deg);
    }

    .star {
      position: absolute;
      z-index: 1;
      width: 13mm;
      height: 13mm;
      color: #fff8e9;
      opacity: 0.88;
    }

    .star svg,
    .doodle svg,
    .film-title svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .doodle {
      position: absolute;
      z-index: 1;
      color: rgba(255, 248, 233, 0.85);
    }

    .doodle.line-1 {
      left: 103mm;
      top: 122mm;
      width: 22mm;
      height: 38mm;
    }

    .doodle.line-2 {
      right: 102mm;
      top: 132mm;
      width: 22mm;
      height: 36mm;
      transform: scaleX(-1);
    }

    .doodle.line-3 {
      left: 104mm;
      top: 252mm;
      width: 24mm;
      height: 50mm;
    }

    .memo.m0 { left: 22mm; top: 67mm; background: #39699e; transform: rotate(-4deg); }
    .memo.m5 { right: 19mm; bottom: 15mm; background: #7091c5; transform: rotate(2deg); }

    .s1 { left: 32mm; top: 135mm; transform: rotate(18deg); }
    .s2 { left: 111mm; top: 92mm; transform: rotate(-11deg); }
    .s3 { right: 35mm; top: 62mm; transform: rotate(28deg); }
    .s4 { right: 24mm; top: 210mm; transform: rotate(-16deg); }
    .s5 { left: 57mm; bottom: 37mm; transform: rotate(8deg); }
    .s6 { right: 113mm; bottom: 40mm; transform: rotate(18deg); }

    .sticker.a { left: 72mm; bottom: 18mm; background: #ef4a47; color: #fff8e9; }
    .sticker.b { left: 100mm; bottom: 19mm; background: #ef4a47; color: #fff8e9; transform: rotate(3deg); }
    [contenteditable="true"] {
      outline: none;
    }

    [contenteditable="true"]:focus {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 0 2px rgba(255, 248, 233, 0.85);
    }

    @media print {
      html,
      body {
        width: 297mm;
        height: 420mm;
        padding: 0;
        background: #fff;
      }

      .sheet {
        margin: 0;
        border: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="sheet" aria-label="A3 成长足迹模版">
    <section class="headline" aria-label="标题和资料">
      <h1 aria-label="成长足迹">
        <span>成</span><span>长</span><span>足</span><span>迹</span>
      </h1>
      <div class="profile-card">
        <div>姓名：<span contenteditable="true"></span></div>
        <div>生日：<span contenteditable="true"></span></div>
        <div>班级：<span contenteditable="true"></span></div>
      </div>
    </section>

    <div class="subtitle" contenteditable="true">0-6 岁时光胶片纪念册</div>

    <div class="film-title" aria-hidden="true">
      <svg viewBox="0 0 320 120">
        <path d="M38 60 C44 22 91 25 107 47 C121 17 172 18 185 52 C208 30 257 37 265 73 C269 94 246 105 220 96 C205 118 157 109 151 85 C135 107 88 108 80 81 C60 94 32 86 38 60Z" fill="#fff0a8" stroke="#24192d" stroke-width="8"/>
        <rect x="78" y="42" width="164" height="52" rx="8" fill="#b86145" stroke="#24192d" stroke-width="5"/>
        <text x="160" y="63" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="800" fill="#fff8e9">GROWTH</text>
        <text x="160" y="86" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" font-weight="800" fill="#fff8e9">0-6 YEARS</text>
        <circle cx="55" cy="69" r="24" fill="#2b252d" stroke="#fff8e9" stroke-width="5"/>
        <circle cx="55" cy="69" r="12" fill="#6e5a76"/>
        <path d="M47 38 L25 26 L25 112 L47 99Z" fill="#2b252d" stroke="#fff8e9" stroke-width="5"/>
      </svg>
    </div>

    <section class="film" aria-label="0 到 6 岁时间轴">
      <div class="film-inner">
        <div class="film-frame"><strong>0岁</strong><span contenteditable="true">来到世界<br>在爱里慢慢长大</span></div>
        <div class="film-frame"><strong>1岁</strong><span contenteditable="true">迈出小脚步<br>开始探索身边</span></div>
        <div class="film-frame"><strong>2岁</strong><span contenteditable="true">学会说好多话<br>好奇心天天发芽</span></div>
        <div class="film-frame"><strong>3岁</strong><span contenteditable="true">第一次上托班<br>学着离开怀抱</span></div>
        <div class="film-frame"><strong>4岁</strong><span contenteditable="true">走进幼儿园<br>认识更多朋友</span></div>
        <div class="film-frame"><strong>5岁</strong><span contenteditable="true">更勇敢地表达<br>每一天都闪光</span></div>
        <div class="film-frame"><strong>6岁</strong><span contenteditable="true">带着成长礼物<br>准备迎接小学</span></div>
      </div>
    </section>

    <section class="cluster age-0" aria-label="0岁照片区">
      <h2>0岁</h2>
    </section>

    <section class="cluster age-1" aria-label="1岁照片区">
      <h2>1岁</h2>
    </section>

    <section class="cluster age-2" aria-label="2岁照片区">
      <h2>2岁</h2>
    </section>

    <section class="cluster age-3" aria-label="3岁照片区">
      <h2>3岁</h2>
    </section>

    <section class="cluster age-4" aria-label="4岁照片区">
      <h2>4岁</h2>
    </section>

    <section class="cluster age-5" aria-label="5岁照片区">
      <h2>5岁</h2>
    </section>

    <section class="cluster age-6" aria-label="6岁照片区">
      <h2>6岁</h2>
    </section>

    <div class="memo m0" contenteditable="true">出生<br>第一天</div>
    <div class="memo m5" contenteditable="true">准备<br>上一年级</div>

    <div class="sticker heart a" contenteditable="true">快乐<br>成长</div>
    <div class="sticker heart b" contenteditable="true">加油<br>宝贝</div>

    <div class="star s1" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M32 4 L39 24 L60 25 L43 38 L49 59 L32 47 L15 59 L21 38 L4 25 L25 24Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg>
    </div>
    <div class="star s2" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M32 4 L39 24 L60 25 L43 38 L49 59 L32 47 L15 59 L21 38 L4 25 L25 24Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg>
    </div>
    <div class="star s3" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M32 4 L39 24 L60 25 L43 38 L49 59 L32 47 L15 59 L21 38 L4 25 L25 24Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg>
    </div>
    <div class="star s4" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M32 4 L39 24 L60 25 L43 38 L49 59 L32 47 L15 59 L21 38 L4 25 L25 24Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg>
    </div>
    <div class="star s5" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M32 4 L39 24 L60 25 L43 38 L49 59 L32 47 L15 59 L21 38 L4 25 L25 24Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg>
    </div>
    <div class="star s6" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M32 4 L39 24 L60 25 L43 38 L49 59 L32 47 L15 59 L21 38 L4 25 L25 24Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></svg>
    </div>

    <div class="doodle line-1" aria-hidden="true">
      <svg viewBox="0 0 80 140">
        <path d="M67 5 C20 28 71 63 31 89 C10 103 26 125 56 132" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 8"/>
      </svg>
    </div>
    <div class="doodle line-2" aria-hidden="true">
      <svg viewBox="0 0 80 140">
        <path d="M67 5 C20 28 71 63 31 89 C10 103 26 125 56 132" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 8"/>
      </svg>
    </div>
    <div class="doodle line-3" aria-hidden="true">
      <svg viewBox="0 0 80 160">
        <path d="M60 8 C13 36 74 70 27 107 C7 123 29 145 59 152" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="9 8"/>
      </svg>
    </div>
  </main>
</body>
</html>
